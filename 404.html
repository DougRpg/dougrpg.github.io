<!DOCTYPE html>
<html lang="pt-BR">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Página não encontrada | DougRPG</title>
	<meta name="robots" content="noindex">
	<meta name="theme-color" content="#0a0b1e">
	<!-- Caminhos começando com "/" porque esta página aparece em qualquer endereço inexistente -->
	<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Press+Start+2P&family=VT323&display=swap">
	<link rel="stylesheet" href="/assets/css/style.css">
	<script src="/assets/js/site.js" defer></script>
</head>

<body>
	<!-- Cabeçalho -->
	<header class="site-header">
		<div class="container site-header__inner">
			<a class="logo" href="/" aria-label="DougRPG — início">
				<img class="logo__mark" src="/assets/img/logo.svg" alt="" width="28" height="28">
				<span class="logo__text">DougRPG</span>
			</a>
			<nav class="site-nav" aria-label="Principal">
				<a href="/#projetos">Projetos</a>
				<a href="https://github.com/DougRpg" target="_blank" rel="noopener">GitHub</a>
			</nav>
		</div>
		<div class="snes-stripe" aria-hidden="true"></div>
	</header>

	<main class="game-over">
		<h1 class="game-over__title">GAME OVER</h1>
		<p class="game-over__text">A página que você procurou não existe (erro 404). Talvez o link esteja errado ou a página tenha mudado de lugar.</p>
		<a class="press-start" href="/">Continuar? Pressione Start</a>
	</main>

	<!-- Rodapé -->
	<footer class="site-footer">
		<div class="snes-stripe" aria-hidden="true"></div>
		<div class="container site-footer__inner">
			<a class="logo" href="/" aria-label="DougRPG — início">
				<img class="logo__mark" src="/assets/img/logo.svg" alt="" width="20" height="20">
				<span class="logo__text">DougRPG</span>
			</a>
			<p>Projetos de tradução de jogos de Super Nintendo e Mega Drive.</p>
			<p>&copy; <span data-year>2026</span> DougRPG</p>
		</div>
	</footer>
</body>

</html>
